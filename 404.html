<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0c1220" id="themeColorMeta">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>404 — КОМПАС ПО ЖИЗНИ</title>
  
  <style>
    /* ===== БАЗОВЫЕ СТИЛИ ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* ===== ПЕРЕМЕННЫЕ ТЕМЫ ===== */
    :root[data-theme="dark"] {
      --bg: #0c1220;
      --card: #1e293b;
      --text: #f1f5f9;
      --text2: #94a3b8;
      --text3: #64748b;
      --accent: #f59e0b;
      --accent2: #d97706;
      --border: #334155;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    :root[data-theme="light"] {
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --text2: #475569;
      --text3: #94a3b8;
      --accent: #f59e0b;
      --accent2: #d97706;
      --border: #e2e8f0;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
    }

    /* ===== СТИЛИ СТРАНИЦЫ ===== */
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .container {
      max-width: 480px;
      width: 100%;
      padding: 40px 30px;
      background: var(--card);
      border-radius: 20px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      text-align: center;
      transition: all 0.3s ease;
      animation: fadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ===== ИКОНКА ===== */
    .icon {
      font-size: 72px;
      margin-bottom: 8px;
      display: block;
      animation: float 3s ease-in-out infinite;
    }

    /* ===== ЗАГОЛОВОК ===== */
    .code {
      font-size: 80px;
      font-weight: 900;
      margin: 0;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -2px;
      line-height: 1;
    }

    .title {
      font-size: 24px;
      font-weight: 700;
      margin: 8px 0 12px;
      color: var(--text);
    }

    .description {
      font-size: 16px;
      color: var(--text2);
      margin: 0 0 24px;
      line-height: 1.6;
    }

    /* ===== КНОПКИ ===== */
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 32px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.25s ease;
      width: 100%;
      max-width: 280px;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(245, 158, 11, 0.3);
    }

    .btn-primary:active {
      transform: scale(0.97);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 28px;
      background: transparent;
      color: var(--text2);
      border: 2px solid var(--border);
      border-radius: 12px;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.25s ease;
      width: 100%;
      max-width: 280px;
    }

    .btn-secondary:hover {
      border-color: var(--text);
      color: var(--text);
      transform: translateY(-2px);
    }

    .btn-secondary:active {
      transform: scale(0.97);
    }

    /* ===== ТЕМА-КНОПКА ===== */
    .theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text);
      z-index: 100;
      box-shadow: var(--shadow);
    }

    .theme-toggle:hover {
      border-color: var(--border-hover);
      transform: scale(1.05);
    }

    /* ===== ССЫЛКА ВНИЗУ ===== */
    .footer {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 13px;
      color: var(--text3);
    }

    .footer a {
      color: var(--accent);
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    /* ===== АНИМАЦИИ ===== */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    /* ===== СКРОЛЛБАР ===== */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--text3); border-radius: 3px; }

    /* ===== РЕСПОНСИВ ===== */
    @media (max-width: 480px) {
      .container {
        padding: 30px 20px;
      }

      .icon {
        font-size: 56px;
      }

      .code {
        font-size: 60px;
      }

      .title {
        font-size: 20px;
      }

      .description {
        font-size: 14px;
      }

      .btn-primary,
      .btn-secondary {
        font-size: 14px;
        padding: 12px 24px;
        max-width: 100%;
      }

      .theme-toggle {
        top: 12px;
        right: 12px;
        padding: 6px 10px;
        font-size: 16px;
      }
    }

    @media (max-width: 360px) {
      .container {
        padding: 24px 16px;
      }

      .icon {
        font-size: 44px;
      }

      .code {
        font-size: 48px;
      }

      .title {
        font-size: 18px;
      }

      .description {
        font-size: 13px;
      }

      .btn-primary,
      .btn-secondary {
        font-size: 13px;
        padding: 10px 20px;
      }
    }
  </style>
</head>
<body>
  <!-- Кнопка переключения темы -->
  <button class="theme-toggle" id="themeToggle" aria-label="Переключить тему">🌙</button>

  <div class="container">
    <!-- Иконка -->
    <span class="icon">🧭</span>

    <!-- Код ошибки -->
    <h1 class="code">404</h1>

    <!-- Заголовок -->
    <h2 class="title">Страница не найдена</h2>

    <!-- Описание -->
    <p class="description">
      Кажется, вы забрели в неизведанную часть КОМПАСА.<br>
      Но не волнуйтесь — мы поможем найти дорогу.
    </p>

    <!-- Кнопки -->
    <div class="buttons">
      <a href="./index.html" class="btn-primary">
        🏠 На главную
      </a>
      <a href="javascript:history.back()" class="btn-secondary">
        ↩️ Вернуться назад
      </a>
    </div>

    <!-- Подвал -->
    <div class="footer">
      <span>КОМПАС ПО ЖИЗНИ v3.0</span>
      <span style="display:block;margin-top:4px;">
        📧 <a href="mailto:compass.life.help@gmail.com">compass.life.help@gmail.com</a>
      </span>
    </div>
  </div>

  <!-- ===== SCRIPTS ===== -->
  <script>
    (function() {
      'use strict';

      // ===== 1. ЗАГРУЗКА ТЕМЫ =====
      function loadTheme() {
        const saved = localStorage.getItem('compass-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', saved);
        updateThemeIcon(saved);
        updateThemeColor(saved);
        return saved;
      }

      function updateThemeIcon(theme) {
        const btn = document.getElementById('themeToggle');
        if (btn) {
          btn.textContent = theme === 'dark' ? '🌙' : '☀️';
        }
      }

      function updateThemeColor(theme) {
        const meta = document.getElementById('themeColorMeta');
        if (meta) {
          meta.content = theme === 'dark' ? '#0c1220' : '#f1f5f9';
        }
      }

      function toggleTheme() {
        const cur = document.documentElement.getAttribute('data-theme') || 'dark';
        const next = cur === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('compass-theme', next);
        updateThemeIcon(next);
        updateThemeColor(next);
      }

      // ===== 2. ИНИЦИАЛИЗАЦИЯ =====
      document.addEventListener('DOMContentLoaded', function() {
        loadTheme();

        const btn = document.getElementById('themeToggle');
        if (btn) {
          btn.addEventListener('click', toggleTheme);
        }

        console.log('✅ 404.html v3.0 загружен');
      });

      // ===== 3. ПОДДЕРЖКА КЛАВИШИ ESC =====
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          window.location.href = './index.html';
        }
      });

      // ===== 4. ПОДДЕРЖКА СИСТЕМНОЙ ТЕМЫ =====
      const darkModeMedia = window.matchMedia('(prefers-color-scheme: dark)');
      darkModeMedia.addEventListener('change', function(e) {
        const saved = localStorage.getItem('compass-theme');
        if (saved === 'system' || !saved) {
          const theme = e.matches ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          updateThemeIcon(theme);
          updateThemeColor(theme);
        }
      });

      console.log('🌙 Тема загружена');
    })();
  </script>
</body>
</html>
