<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#22c55e" id="themeColorMeta">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>💰 КОМПАС — Деньги</title>
  <meta name="apple-mobile-web-app-title" content="Компас">
  <link rel="manifest" href="../../manifest.json">
  <link rel="apple-touch-icon" href="../../assets/icons/icon-192.png">
  <link rel="stylesheet" href="../../css/styles.css">
  <link rel="stylesheet" href="../../css/modules/money.css">
  
  <style>
    /* ===== ДОПОЛНИТЕЛЬНЫЕ СТИЛИ ДЛЯ МОДУЛЯ ===== */
    .module-header {
      text-align: center;
      padding: 20px 16px 8px;
    }
    
    .module-header .module-icon {
      font-size: 48px;
    }
    
    .module-header h1 {
      font-size: 28px;
      margin: 4px 0;
      font-weight: 800;
      color: var(--text);
    }
    
    .module-header .module-subtitle {
      font-size: 15px;
      color: var(--text2);
      margin: 0;
    }
    
    .lang-switcher {
      display: flex;
      gap: 8px;
      justify-content: center;
      padding: 8px 16px;
      flex-wrap: wrap;
    }
    
    .lang-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text2);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .lang-btn:hover {
      border-color: var(--border-hover);
      color: var(--text);
    }
    
    .lang-btn.active {
      border-color: #22c55e;
      color: #22c55e;
      font-weight: 600;
    }
    
    .theme-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text2);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .theme-btn:hover {
      border-color: var(--border-hover);
      color: var(--text);
    }
    
    .cat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 0 16px 16px;
    }
    
    .cat-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 20px 12px;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 16px;
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      min-height: 100px;
      text-align: center;
    }
    
    .cat-btn:hover {
      transform: translateY(-3px);
      border-color: #22c55e;
      box-shadow: 0 4px 20px rgba(34, 197, 94, 0.15);
    }
    
    .cat-btn:active {
      transform: scale(0.97);
    }
    
    .cat-btn .cat-icon {
      font-size: 32px;
    }
    
    .cat-btn .cat-badge {
      font-size: 11px;
      background: #22c55e;
      color: #fff;
      padding: 2px 10px;
      border-radius: 12px;
      font-weight: 700;
    }
    
    /* ===== КВИЗ ===== */
    .quiz-back {
      padding: 16px;
      text-align: center;
    }
    
    .quiz-back .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text2);
      padding: 10px 24px;
      border-radius: 12px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .quiz-back .btn-secondary:hover {
      border-color: var(--border-hover);
      color: var(--text);
    }
    
    /* ===== СТАТИСТИКА НА ГЛАВНОЙ ===== */
    .stats-section {
      margin: 0 16px 16px;
      padding: 16px;
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--border);
    }
    
    .stats-section h3 {
      font-size: 14px;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 0 0 12px;
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    
    .stats-item {
      text-align: center;
      padding: 8px;
      background: var(--bg);
      border-radius: 10px;
    }
    
    .stats-item .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
    }
    
    .stats-item .stat-label {
      font-size: 11px;
      color: var(--text3);
      margin-top: 2px;
    }
    
    /* ===== АДАПТИВ ===== */
    @media (max-width: 480px) {
      .cat-grid {
        gap: 8px;
      }
      .cat-btn {
        padding: 16px 8px;
        min-height: 80px;
        font-size: 13px;
      }
      .cat-btn .cat-icon {
        font-size: 28px;
      }
      .module-header h1 {
        font-size: 24px;
      }
      .stats-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }
      .stats-item .stat-value {
        font-size: 17px;
      }
    }
    
    @media (max-width: 360px) {
      .cat-grid {
        gap: 6px;
      }
      .cat-btn {
        padding: 12px 6px;
        min-height: 70px;
        font-size: 12px;
      }
      .cat-btn .cat-icon {
        font-size: 22px;
      }
      .module-header h1 {
        font-size: 20px;
      }
      .stats-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
      }
      .stats-item .stat-value {
        font-size: 15px;
      }
    }
  </style>
</head>
<body data-module="money">
  <div class="app">
    <!-- ===== ЭКРАН ГЛАВНОЙ ===== -->
    <div class="screen active" id="screen-home">
      <div class="module-header">
        <div class="module-icon">💰</div>
        <h1 data-i18n="money_title">Деньги</h1>
        <p class="module-subtitle" data-i18n="money_subtitle">Выберите направление</p>
      </div>

      <div class="lang-switcher">
        <button class="lang-btn active" data-lang="ru" onclick="setLang('ru')">🇷🇺 RU</button>
        <button class="lang-btn" data-lang="en" onclick="setLang('en')">🇬🇧 EN</button>
        <button class="theme-btn" onclick="window.toggleTheme && window.toggleTheme()">🌙</button>
      </div>

      <div class="cat-grid">
        <!-- Финансовая ОС -->
        <button class="cat-btn" onclick="startFlow('os')">
          <span class="cat-icon">💳</span>
          <span data-i18n="cat_os">Финансовая ОС</span>
        </button>
        
        <!-- Аудит бюджета -->
        <button class="cat-btn" onclick="startFlow('audit')">
          <span class="cat-icon">📊</span>
          <span data-i18n="cat_audit">Аудит бюджета</span>
        </button>
        
        <!-- Инвестиции (заглушка) -->
        <button class="cat-btn" onclick="showToast('🔄 В разработке')" style="opacity:0.6">
          <span class="cat-icon">📈</span>
          <span data-i18n="cat_investments">Инвестиции</span>
        </button>
        
        <!-- Долги (заглушка) -->
        <button class="cat-btn" onclick="showToast('🔄 В разработке')" style="opacity:0.6">
          <span class="cat-icon">🧾</span>
          <span data-i18n="cat_debts">Долги и кредиты</span>
        </button>
      </div>

      <!-- Статистика -->
      <div class="stats-section" id="statsSection">
        <h3 data-i18n="stats_title">📊 Ваша статистика</h3>
        <div class="stats-grid" id="statsGrid">
          <div class="stats-item">
            <div class="stat-value" id="statSavings">-</div>
            <div class="stat-label" data-i18n="stat_savings">Подушка</div>
          </div>
          <div class="stats-item">
            <div class="stat-value" id="statLeak">-</div>
            <div class="stat-label" data-i18n="stat_leak">Утечка</div>
          </div>
          <div class="stats-item">
            <div class="stat-value" id="statProgress">-</div>
            <div class="stat-label" data-i18n="stat_progress">Прогресс</div>
          </div>
        </div>
      </div>

      <div style="text-align:center;padding:16px 0 24px">
        <a href="../../index.html" style="color:var(--text2);text-decoration:none;font-size:14px;transition:color 0.2s" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--text2)'">
          ← <span data-i18n="back_home">На главную</span>
        </a>
      </div>
    </div>

    <!-- ===== ЭКРАН КВИЗА ===== -->
    <div class="screen" id="screen-quiz">
      <div class="module-header">
        <div class="module-icon">💰</div>
        <h1 id="quiz-title" data-i18n="money_title">Деньги</h1>
        <p class="module-subtitle" id="quiz-subtitle" data-i18n="quiz_in_progress">Прохождение квиза</p>
      </div>

      <div id="quiz-container" style="padding:0 16px"></div>

      <div class="quiz-back">
        <button class="btn-secondary" onclick="goHome()">← <span data-i18n="back">Назад</span></button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- ===== SCRIPTS ===== -->
  <script src="../../core/locales.js"></script>
  <script src="../../core/registry.js"></script>
  <script src="../../core/theme.js"></script>
  <script src="../../core/progressEngine.js"></script>
  
  <script>
    // ===== УСТАНОВКА ЯЗЫКА =====
    function setLang(l) {
      localStorage.setItem('compass_lang', l);
      window.currentLang = l;
      location.reload();
    }
    
    window.currentLang = localStorage.getItem('compass_lang') || 'ru';
    
    // Активируем кнопку текущего языка
    document.addEventListener('DOMContentLoaded', function() {
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === window.currentLang);
      });
    });
  </script>

  <!-- ===== ДАННЫЕ КВИЗОВ ===== -->
  <script src="data/os.js"></script>
  <script src="data/en/os-en.js"></script>
  <script src="data/audit.js"></script>
  <script src="data/en/audit-en.js"></script>

  <!-- ===== ЯДРО ===== -->
  <script src="../../core/engine.js"></script>
  <script src="../../core/tracker.js"></script>
  <script src="../../core/app.js"></script>

  <script>
    // ===== SERVICE WORKER =====
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../../sw.js')
        .then(r => console.log('✅ SW ok', r.scope))
        .catch(e => console.error('❌ SW err', e));
    }

    // ===== ОБНОВЛЕНИЕ МЕТА-ТЕГА ТЕМЫ =====
    function updateThemeColor() {
      const meta = document.getElementById('themeColorMeta');
      if (!meta) return;
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      meta.content = isDark ? '#0c1220' : '#f1f5f9';
    }
    
    const observer = new MutationObserver(function() {
      updateThemeColor();
    });
    observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    updateThemeColor();

    // ===== ОБНОВЛЕНИЕ ПЕРЕВОДОВ =====
    function updateTranslations() {
      const lang = window.currentLang || 'ru';
      const texts = typeof LOCALES !== 'undefined' ? (LOCALES[lang] || LOCALES.ru) : {};
      
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        if (texts[key]) {
          el.textContent = texts[key];
        }
      });
    }
    
    // ===== ОБНОВЛЕНИЕ СТАТИСТИКИ =====
    function updateStats() {
      if (typeof ProgressEngine === 'undefined') {
        document.getElementById('statSavings').textContent = '-';
        document.getElementById('statLeak').textContent = '-';
        document.getElementById('statProgress').textContent = '-';
        return;
      }
      
      // Подушка (из ОС)
      const osAnswers = ProgressEngine.getAnswers('money', 'os');
      const savings = osAnswers.savings ? osAnswers.savings.answer : null;
      const savingsLabels = {
        'yes_6m': '✅ 6+ мес',
        'yes_3m': '🟡 3 мес',
        'no_savings': '❌ Нет'
      };
      document.getElementById('statSavings').textContent = savings ? (savingsLabels[savings] || '❓') : '-';
      
      // Утечка (из аудита)
      const auditAnswers = ProgressEngine.getAnswers('money', 'audit');
      const leak = auditAnswers.biggest_leak ? auditAnswers.biggest_leak.answer : null;
      const leakLabels = {
        'impulse': '🛍️ Импульсы',
        'subscriptions': '📺 Подписки',
        'food': '🍕 Еда вне',
        'entertainment': '🎉 Развлечения',
        'small': '💸 Мелочи'
      };
      document.getElementById('statLeak').textContent = leak ? (leakLabels[leak] || '❓') : '-';
      
      // Прогресс
      const totalAnswers = Object.keys(osAnswers).length + Object.keys(auditAnswers).length;
      const maxQuestions = 12; // Примерное количество
      const pct = Math.min(Math.round((totalAnswers / maxQuestions) * 100), 100);
      document.getElementById('statProgress').textContent = pct > 0 ? pct + '%' : '-';
    }

    // ===== ЗАПУСК =====
    document.addEventListener('DOMContentLoaded', function() {
      updateTranslations();
      setTimeout(updateStats, 300);
    });

    console.log('✅ Money index.html v3.0 загружен');
    console.log('🌍 Текущий язык:', window.currentLang);
  </script>
</body>
</html>
