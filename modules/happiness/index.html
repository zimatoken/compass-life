<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#f59e0b">
  <title>😊 КОМПАС — Счастье</title>
  <link rel="stylesheet" href="../../css/styles.css">
  <link rel="stylesheet" href="../../css/module.css">
  <link rel="stylesheet" href="../../css/modules/happiness.css">
</head>
<body data-module="happiness">
  <nav class="module-nav"><button class="nav-btn" onclick="goHome()">🏠 Главная</button></nav>

  <div id="screen-categories" class="screen active">
    <header class="module-header">
      <div class="module-icon">😊</div>
      <h1 class="module-title" id="moduleTitle">Счастье</h1>
      <p class="module-desc" id="moduleDesc">Найди свои блоки и источники энергии</p>
    </header>

    <div class="personal-greeting-container" id="greetingContainer"></div>
    <div class="module-progress" id="moduleProgress"></div>

    <!-- 4 КНОПКИ (2 РАБОЧИЕ + 2 ЗАГЛУШКИ) -->
    <div class="cat-grid">
      <!-- Блокеры (рабочий) -->
      <button class="cat-btn" onclick="startFlow('blockers')">
        <span class="cat-icon">🚧</span>
        <span data-i18n="cat_blockers">Блокеры счастья</span>
      </button>

      <!-- Энергоаудит (рабочий) -->
      <button class="cat-btn" onclick="startFlow('energy_audit')">
        <span class="cat-icon">⚡</span>
        <span data-i18n="cat_energy_audit">Энергоаудит</span>
      </button>

      <!-- Дневник благодарности (заглушка) -->
      <button class="cat-btn" onclick="showToast('🔄 В разработке')" style="opacity:0.6">
        <span class="cat-icon">📓</span>
        <span data-i18n="cat_gratitude">Дневник благодарности</span>
      </button>

      <!-- Радость (заглушка) -->
      <button class="cat-btn" onclick="showToast('🔄 В разработке')" style="opacity:0.6">
        <span class="cat-icon">🌈</span>
        <span data-i18n="cat_joy">Радость</span>
      </button>
    </div>

    <!-- Статистика -->
    <div class="stats-section" id="statsSection">
      <h3 data-i18n="stats_title">📊 Ваша статистика</h3>
      <div class="stats-grid" id="statsGrid">
        <div class="stats-item">
          <div class="stat-value" id="statEnergy">-</div>
          <div class="stat-label" data-i18n="stat_energy">Энергия</div>
        </div>
        <div class="stats-item">
          <div class="stat-value" id="statBlockers">-</div>
          <div class="stat-label" data-i18n="stat_blockers">Блокеров найдено</div>
        </div>
        <div class="stats-item">
          <div class="stat-value" id="statProgress">-</div>
          <div class="stat-label" data-i18n="stat_progress">Прогресс</div>
        </div>
      </div>
    </div>

    <section class="timeline-section">
      <h3 id="timelineTitle">📖 История инсайтов</h3>
      <div id="timelineContainer"></div>
    </section>

    <section class="chart-section">
      <h3 id="chartTitle">📊 Прогресс за неделю</h3>
      <div id="chartContainer"></div>
    </section>
  </div>

  <div id="screen-quiz" class="screen">
    <nav class="quiz-nav"><button class="nav-btn" onclick="showScreen('screen-categories')">← К категориям</button></nav>
    <div class="quiz-header"><div class="quiz-icon" id="quizIcon">🎯</div><h2 id="quiz-title">Квиз</h2></div>
    <div id="quiz-container"></div>
  </div>

  <div id="toast" class="toast"></div>

  <!-- ===== ПРАВИЛЬНЫЙ ПОРЯДОК ЗАГРУЗКИ ===== -->
  <script src="../../core/locales.js"></script>
  <script src="../../core/registry.js"></script>
  <script src="../../core/theme.js"></script>
  <script src="../../core/progressEngine.js"></script>

  <script src="data/blockers.js"></script>
  <script src="data/energy_audit.js"></script>
  <script src="data/en/blockers-en.js"></script>
  <script src="data/en/energy_audit-en.js"></script>

  <script>window.currentLang = localStorage.getItem('compass_lang') || 'ru';</script>

  <script src="../../core/engine.js"></script>
  <script src="../../core/tracker.js"></script>
  <script src="../../core/app.js"></script>

  <script>
    (function initModule() {
      const moduleName = document.body.dataset.module;
      const lang = localStorage.getItem('compass_lang') || 'ru';
      window.currentLang = lang;
      document.documentElement.lang = lang;

      const titleEl = document.getElementById('moduleTitle');
      const descEl = document.getElementById('moduleDesc');
      if (typeof t === 'function') {
        if (titleEl) titleEl.textContent = t('cat_' + moduleName) || moduleName;
        if (descEl) descEl.textContent = t('cat_' + moduleName + '_desc') || '';
        document.getElementById('timelineTitle').textContent = t('timeline_title') || '📖 История инсайтов';
        document.getElementById('chartTitle').textContent = t('week_chart_title') || '📊 Прогресс за неделю';
      }

      const greetingContainer = document.getElementById('greetingContainer');
      if (greetingContainer && typeof renderPersonalGreeting === 'function') {
        greetingContainer.innerHTML = renderPersonalGreeting();
      }

      // 4 кнопки уже в HTML — НЕ удаляем!

      if (typeof InsightTimeline !== 'undefined') InsightTimeline.render('timelineContainer');

      if (typeof ProgressChart !== 'undefined') {
        const data = ProgressChart.getWeeklyData();
        const hasData = data && data.some(d => d.value > 0);
        const container = document.getElementById('chartContainer');
        if (hasData) {
          ProgressChart.renderMini('chartContainer', data);
        } else if (container) {
          container.innerHTML = '<p style="color:var(--text3);font-size:13px;text-align:center;padding:12px 0;">📊 Выполняй задания — и здесь появится график</p>';
        }
      }

      renderModuleProgress(moduleName);

      updateStats();

      if (typeof FollowUpEngine !== 'undefined') setTimeout(() => FollowUpEngine.checkAndShow(), 1500);
    })();

    function renderModuleProgress(moduleName) {
      const container = document.getElementById('moduleProgress');
      if (!container) return;

      const moduleCategories = {
        purpose: ['passion', 'skills'],
        happiness: ['blockers', 'energy_audit'],
        habits: ['identity', 'environment'],
        money: ['os', 'audit'],
        responsibility: ['commitments', 'planning'],
        health: ['sleep', 'nutrition'],
        learning: ['reading', 'techniques'],
        creativity: ['channel', 'fear'],
        relationships: ['family', 'conflicts']
      };

      const cats = moduleCategories[moduleName] || [];
      const done = cats.filter(c => localStorage.getItem('compass_' + moduleName + '_' + c + '_completed') === 'true').length;
      const pct = cats.length ? Math.round((done / cats.length) * 100) : 0;
      container.innerHTML = `
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="progress-text">${typeof t === 'function' ? t('progress_modules') : '📊 Прогресс'}: ${done}/${cats.length}</div>
      `;
    }

    function updateStats() {
      if (typeof ProgressEngine === 'undefined') {
        document.getElementById('statEnergy').textContent = '-';
        document.getElementById('statBlockers').textContent = '-';
        document.getElementById('statProgress').textContent = '-';
        return;
      }

      const avgEnergy = ProgressEngine.getAverageEnergy ? ProgressEngine.getAverageEnergy(7) : null;
      document.getElementById('statEnergy').textContent = avgEnergy !== null ? avgEnergy + '/10' : '-';

      const profile = ProgressEngine.getModuleProfile('happiness');
      const blockersCount = profile && profile.blocks ? profile.blocks.length : 0;
      document.getElementById('statBlockers').textContent = blockersCount > 0 ? blockersCount : '0';

      const answers = ProgressEngine.getAnswers('happiness', 'blockers');
      const energyAnswers = ProgressEngine.getAnswers('happiness', 'energy_audit');
      const total = Object.keys(answers).length + Object.keys(energyAnswers).length;
      const maxQuestions = 12;
      const pct = Math.min(Math.round((total / maxQuestions) * 100), 100);
      document.getElementById('statProgress').textContent = pct + '%';
    }
  </script>
</body>
</html>
