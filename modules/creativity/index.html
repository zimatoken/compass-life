<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#d946ef" id="themeColorMeta">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>🎨 КОМПАС — Творчество</title>
  <meta name="apple-mobile-web-app-title" content="Компас">
  <link rel="manifest" href="../../manifest.json">
  <link rel="apple-touch-icon" href="../../assets/icons/icon-192.png">
  <link rel="stylesheet" href="../../css/styles.css">
  <link rel="stylesheet" href="../../css/module.css">
  <link rel="stylesheet" href="../../css/modules/creativity.css">
  
  <style>
    /* ===== ДОПОЛНИТЕЛЬНЫЕ СТИЛИ ДЛЯ МОДУЛЯ ===== */
    .lang-btn.active {
      border-color: #d946ef;
      color: #d946ef;
    }
    
    .cat-btn:hover {
      border-color: #d946ef;
      box-shadow: 0 4px 20px rgba(217, 70, 239, 0.15);
    }
    
    .cat-btn .cat-badge {
      font-size: 11px;
      background: #22c55e;
      color: #fff;
      padding: 2px 10px;
      border-radius: 12px;
      font-weight: 700;
    }
    
    /* ===== КВИЗ ===== */
    .quiz-back {
      padding: 16px;
      text-align: center;
    }
    
    .quiz-back .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text2);
      padding: 10px 24px;
      border-radius: 12px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .quiz-back .btn-secondary:hover {
      border-color: var(--border-hover);
      color: var(--text);
    }
    
    /* ===== TIMELINE ===== */
    .timeline-section {
      margin: 16px;
      padding: 16px;
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--border);
    }
    
    .timeline-section h3 {
      font-size: 14px;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 0 0 12px;
    }
    
    /* ===== CHART ===== */
    .chart-section {
      margin: 16px;
      padding: 16px;
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--border);
    }
    
    .chart-section h3 {
      font-size: 14px;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 0 0 12px;
    }
    
    /* ===== АДАПТИВ ===== */
    @media (max-width: 480px) {
      .cat-grid {
        gap: 8px;
      }
      .cat-btn {
        padding: 16px 8px;
        min-height: 80px;
        font-size: 13px;
      }
      .cat-btn .cat-icon {
        font-size: 28px;
      }
      .module-header h1 {
        font-size: 24px;
      }
    }
    
    @media (max-width: 360px) {
      .cat-grid {
        gap: 6px;
      }
      .cat-btn {
        padding: 12px 6px;
        min-height: 70px;
        font-size: 12px;
      }
      .cat-btn .cat-icon {
        font-size: 22px;
      }
      .module-header h1 {
        font-size: 20px;
      }
    }
  </style>
</head>
<body data-module="creativity">
  <div class="app">
    <!-- ===== ЭКРАН ГЛАВНОЙ ===== -->
    <div class="screen active" id="screen-home">
      <div class="module-header">
        <div class="module-icon">🎨</div>
        <h1 data-i18n="creativity_title">Творчество</h1>
        <p class="module-subtitle" data-i18n="creativity_subtitle">Выберите направление</p>
      </div>

      <div class="lang-switcher">
        <button class="lang-btn active" data-lang="ru" onclick="setLang('ru')">🇷🇺 RU</button>
        <button class="lang-btn" data-lang="en" onclick="setLang('en')">🇬🇧 EN</button>
        <button class="theme-btn" onclick="window.toggleTheme && window.toggleTheme()">🌙</button>
      </div>

      <!-- ===== ПРИВЕТСТВИЕ ===== -->
      <div id="greetingContainer"></div>

      <!-- ===== ПРОГРЕСС МОДУЛЯ ===== -->
      <div id="moduleProgress"></div>

      <!-- ===== 4 КНОПКИ (2 РАБОЧИЕ + 2 ЗАГЛУШКИ) ===== -->
      <div class="cat-grid">
        <!-- Канал (рабочий) -->
        <button class="cat-btn" onclick="startFlow('channel')">
          <span class="cat-icon">🖌️</span>
          <span data-i18n="cat_channel">Канал</span>
        </button>

        <!-- Страх (рабочий) -->
        <button class="cat-btn" onclick="startFlow('fear')">
          <span class="cat-icon">🚀</span>
          <span data-i18n="cat_fear">Страх</span>
        </button>

        <!-- Блоки (заглушка) -->
        <button class="cat-btn" onclick="showToast('🔄 В разработке')" style="opacity:0.6">
          <span class="cat-icon">🧱</span>
          <span data-i18n="cat_blocks">Блоки</span>
        </button>

        <!-- Вдохновение (заглушка) -->
        <button class="cat-btn" onclick="showToast('🔄 В разработке')" style="opacity:0.6">
          <span class="cat-icon">✨</span>
          <span data-i18n="cat_inspiration">Вдохновение</span>
        </button>
      </div>

      <!-- ===== TIMELINE ===== -->
      <div class="timeline-section">
        <h3 id="timelineTitle">📖 История инсайтов</h3>
        <div id="timelineContainer"></div>
      </div>

      <!-- ===== ГРАФИК ===== -->
      <div class="chart-section">
        <h3 id="chartTitle">📊 Прогресс за неделю</h3>
        <div id="chartContainer"></div>
      </div>

      <div style="text-align:center;padding:16px 0 24px">
        <a href="../../index.html" style="color:var(--text2);text-decoration:none;font-size:14px;transition:color 0.2s" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--text2)'">
          ← <span data-i18n="back_home">На главную</span>
        </a>
      </div>
    </div>

    <!-- ===== ЭКРАН КВИЗА ===== -->
    <div class="screen" id="screen-quiz">
      <div class="module-header">
        <div class="module-icon">🎨</div>
        <h1 id="quiz-title" data-i18n="creativity_title">Творчество</h1>
        <p class="module-subtitle" id="quiz-subtitle" data-i18n="quiz_in_progress">Прохождение квиза</p>
      </div>

      <div id="quiz-container" style="padding:0 16px"></div>

      <div class="quiz-back">
        <button class="btn-secondary" onclick="goHome()">← <span data-i18n="back">Назад</span></button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- ===== SCRIPTS ===== -->
  <script src="../../core/locales.js"></script>
  <script src="../../core/utils.js"></script>
  <script src="../../core/registry.js"></script>
  <script src="../../core/theme.js"></script>
  <script src="../../core/progressEngine.js"></script>

  <script>
    // ===== УСТАНОВКА ЯЗЫКА =====
    window.currentLang = localStorage.getItem('compass_lang') || 'ru';
    
    document.addEventListener('DOMContentLoaded', function() {
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === window.currentLang);
      });
    });
  </script>

  <!-- ===== ДАННЫЕ КВИЗОВ ===== -->
  <script src="data/channel.js"></script>
  <script src="data/fear.js"></script>
  <script src="data/en/channel-en.js"></script>
  <script src="data/en/fear-en.js"></script>

  <!-- ===== ЯДРО ===== -->
  <script src="../../core/engine.js"></script>
  <script src="../../core/tracker.js"></script>
  <script src="../../core/app.js"></script>

  <script>
    // ===== SERVICE WORKER =====
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../../sw.js')
        .then(r => console.log('✅ SW ok', r.scope))
        .catch(e => console.error('❌ SW err', e));
    }

    // ===== ОБНОВЛЕНИЕ МЕТА-ТЕГА ТЕМЫ =====
    const observer = new MutationObserver(function() {
      window.updateThemeColor();
    });
    observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    window.updateThemeColor();

    // ===== ОБНОВЛЕНИЕ СТАТИСТИКИ =====
    (function initModule() {
      const moduleName = document.body.dataset.module;
      const lang = localStorage.getItem('compass_lang') || 'ru';
      window.currentLang = lang;
      document.documentElement.lang = lang;

      // Заголовки
      const titleEl = document.getElementById('quiz-title');
      if (titleEl && typeof t === 'function') {
        titleEl.textContent = t('cat_' + moduleName) || moduleName;
      }

      // Приветствие
      const greetingContainer = document.getElementById('greetingContainer');
      if (greetingContainer && typeof renderPersonalGreeting === 'function') {
        greetingContainer.innerHTML = renderPersonalGreeting();
      }

      // Прогресс модуля
      renderModuleProgress(moduleName);

      // Timeline
      if (typeof InsightTimeline !== 'undefined') {
        InsightTimeline.render('timelineContainer');
      }

      // График
      if (typeof ProgressChart !== 'undefined') {
        const data = ProgressChart.getWeeklyData();
        const hasData = data && data.some(d => d.value > 0);
        const container = document.getElementById('chartContainer');
        if (hasData) {
          ProgressChart.renderMini('chartContainer', data);
        } else if (container) {
          container.innerHTML = '<p style="color:var(--text3);font-size:13px;text-align:center;padding:12px 0;">📊 Выполняй задания — и здесь появится график</p>';
        }
      }

      // Follow-up
      if (typeof FollowUpEngine !== 'undefined') {
        setTimeout(() => FollowUpEngine.checkAndShow(), 1500);
      }
    })();
  </script>
</body>
</html>
