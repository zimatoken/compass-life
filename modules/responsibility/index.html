<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#3b82f6" id="themeColorMeta">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>⚡ КОМПАС — Ответственность</title>
  <meta name="apple-mobile-web-app-title" content="Компас">
  <link rel="manifest" href="../../manifest.json">
  <link rel="apple-touch-icon" href="../../assets/icons/icon-192.png">
  <link rel="stylesheet" href="../../css/styles.css">
  <link rel="stylesheet" href="../../css/module.css">
  <link rel="stylesheet" href="../../css/modules/responsibility.css">
  
  <style>
    /* ===== ДОПОЛНИТЕЛЬНЫЕ СТИЛИ ДЛЯ МОДУЛЯ ===== */
    .lang-btn.active {
      border-color: #3b82f6;
      color: #3b82f6;
    }
    
    .cat-btn:hover {
      border-color: #3b82f6;
      box-shadow: 0 4px 20px rgba(59, 130, 246, 0.15);
    }
    
    .cat-btn .cat-badge {
      font-size: 11px;
      background: #22c55e;
      color: #fff;
      padding: 2px 10px;
      border-radius: 12px;
      font-weight: 700;
    }
    
    /* ===== КВИЗ ===== */
    .quiz-back {
      padding: 16px;
      text-align: center;
    }
    
    .quiz-back .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text2);
      padding: 10px 24px;
      border-radius: 12px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .quiz-back .btn-secondary:hover {
      border-color: var(--border-hover);
      color: var(--text);
    }
    
    /* ===== СТАТИСТИКА ===== */
    .stats-section {
      margin: 0 16px 16px;
      padding: 16px;
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--border);
    }
    
    .stats-section h3 {
      font-size: 14px;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 0 0 12px;
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    
    .stats-item {
      text-align: center;
      padding: 8px;
      background: var(--bg);
      border-radius: 10px;
    }
    
    .stats-item .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
    }
    
    .stats-item .stat-label {
      font-size: 11px;
      color: var(--text3);
      margin-top: 2px;
    }
    
    /* ===== TIMELINE ===== */
    .timeline-section {
      margin: 16px;
      padding: 16px;
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--border);
    }
    
    .timeline-section h3 {
      font-size: 14px;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 0 0 12px;
    }
    
    /* ===== CHART ===== */
    .chart-section {
      margin: 16px;
      padding: 16px;
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--border);
    }
    
    .chart-section h3 {
      font-size: 14px;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 0 0 12px;
    }
    
    /* ===== ПРОГРЕСС ===== */
    .progress-bar {
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 6px;
    }
    
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      border-radius: 3px;
      transition: width 0.6s ease;
    }
    
    .progress-text {
      font-size: 12px;
      color: var(--text3);
      text-align: center;
    }
    
    /* ===== АДАПТИВ ===== */
    @media (max-width: 480px) {
      .cat-grid {
        gap: 8px;
      }
      .cat-btn {
        padding: 16px 8px;
        min-height: 80px;
        font-size: 13px;
      }
      .cat-btn .cat-icon {
        font-size: 28px;
      }
      .module-header h1 {
        font-size: 24px;
      }
      .stats-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }
      .stats-item .stat-value {
        font-size: 17px;
      }
    }
    
    @media (max-width: 360px) {
      .cat-grid {
        gap: 6px;
      }
      .cat-btn {
        padding: 12px 6px;
        min-height: 70px;
        font-size: 12px;
      }
      .cat-btn .cat-icon {
        font-size: 22px;
      }
      .module-header h1 {
        font-size: 20px;
      }
      .stats-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
      }
      .stats-item .stat-value {
        font-size: 15px;
      }
    }
  </style>
</head>
<body data-module="responsibility">
  <div class="app">
    <!-- ===== ЭКРАН ГЛАВНОЙ ===== -->
    <div class="screen active" id="screen-home">
      <div class="module-header">
        <div class="module-icon">⚡</div>
        <h1 data-i18n="responsibility_title">Ответственность</h1>
        <p class="module-subtitle" data-i18n="responsibility_subtitle">Выберите направление</p>
      </div>

      <div class="lang-switcher">
        <button class="lang-btn active" data-lang="ru" onclick="setLang('ru')">🇷🇺 RU</button>
        <button class="lang-btn" data-lang="en" onclick="setLang('en')">🇬🇧 EN</button>
        <button class="theme-btn" onclick="window.toggleTheme && window.toggleTheme()">🌙</button>
      </div>

      <!-- ===== ПРИВЕТСТВИЕ ===== -->
      <div id="greetingContainer"></div>

      <!-- ===== ПРОГРЕСС МОДУЛЯ ===== -->
      <div id="moduleProgress"></div>

      <!-- ===== 4 КНОПКИ (2 РАБОЧИЕ + 2 ЗАГЛУШКИ) ===== -->
      <div class="cat-grid">
        <!-- Обязательства (рабочий) -->
        <button class="cat-btn" onclick="startFlow('commitments')">
          <span class="cat-icon">📋</span>
          <span data-i18n="cat_commitments">Обязательства</span>
        </button>

        <!-- Планирование (рабочий) -->
        <button class="cat-btn" onclick="startFlow('planning')">
          <span class="cat-icon">📅</span>
          <span data-i18n="cat_planning">Планирование</span>
        </button>

        <!-- Дисциплина (заглушка) -->
        <button class="cat-btn" onclick="showToast('🔄 В разработке')" style="opacity:0.6">
          <span class="cat-icon">🎯</span>
          <span data-i18n="cat_discipline">Дисциплина</span>
        </button>

        <!-- Делегирование (заглушка) -->
        <button class="cat-btn" onclick="showToast('🔄 В разработке')" style="opacity:0.6">
          <span class="cat-icon">🤝</span>
          <span data-i18n="cat_delegation">Делегирование</span>
        </button>
      </div>

      <!-- ===== СТАТИСТИКА ===== -->
      <div class="stats-section" id="statsSection">
        <h3 data-i18n="stats_title">📊 Ваша статистика</h3>
        <div class="stats-grid" id="statsGrid">
          <div class="stats-item">
            <div class="stat-value" id="statCommitments">-</div>
            <div class="stat-label" data-i18n="stat_commitments">Обязательства</div>
          </div>
          <div class="stats-item">
            <div class="stat-value" id="statPlanning">-</div>
            <div class="stat-label" data-i18n="stat_planning">Планирование</div>
          </div>
          <div class="stats-item">
            <div class="stat-value" id="statProgress">-</div>
            <div class="stat-label" data-i18n="stat_progress">Прогресс</div>
          </div>
        </div>
      </div>

      <!-- ===== TIMELINE ===== -->
      <div class="timeline-section">
        <h3 id="timelineTitle">📖 История инсайтов</h3>
        <div id="timelineContainer"></div>
      </div>

      <!-- ===== ГРАФИК ===== -->
      <div class="chart-section">
        <h3 id="chartTitle">📊 Прогресс за неделю</h3>
        <div id="chartContainer"></div>
      </div>

      <div style="text-align:center;padding:16px 0 24px">
        <a href="../../index.html" style="color:var(--text2);text-decoration:none;font-size:14px;transition:color 0.2s" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--text2)'">
          ← <span data-i18n="back_home">На главную</span>
        </a>
      </div>
    </div>

    <!-- ===== ЭКРАН КВИЗА ===== -->
    <div class="screen" id="screen-quiz">
      <div class="module-header">
        <div class="module-icon">⚡</div>
        <h1 id="quiz-title" data-i18n="responsibility_title">Ответственность</h1>
        <p class="module-subtitle" id="quiz-subtitle" data-i18n="quiz_in_progress">Прохождение квиза</p>
      </div>

      <div id="quiz-container" style="padding:0 16px"></div>

      <div class="quiz-back">
        <button class="btn-secondary" onclick="goHome()">← <span data-i18n="back">Назад</span></button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- ===== SCRIPTS ===== -->
  <script src="../../core/locales.js"></script>
  <script src="../../core/utils.js"></script>
  <script src="../../core/registry.js"></script>
  <script src="../../core/theme.js"></script>
  <script src="../../core/progressEngine.js"></script>

  <script>
    // ===== УСТАНОВКА ЯЗЫКА =====
    window.currentLang = localStorage.getItem('compass_lang') || 'ru';
    
    document.addEventListener('DOMContentLoaded', function() {
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === window.currentLang);
      });
    });
  </script>

  <!-- ===== ДАННЫЕ КВИЗОВ ===== -->
  <script src="data/commitments.js"></script>
  <script src="data/planning.js"></script>
  <script src="data/en/commitments-en.js"></script>
  <script src="data/en/planning-en.js"></script>

  <!-- ===== ЯДРО ===== -->
  <script src="../../core/engine.js"></script>
  <script src="../../core/tracker.js"></script>
  <script src="../../core/app.js"></script>

  <script>
    // ===== SERVICE WORKER =====
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../../sw.js')
        .then(r => console.log('✅ SW ok', r.scope))
        .catch(e => console.error('❌ SW err', e));
    }

    // ===== ОБНОВЛЕНИЕ МЕТА-ТЕГА ТЕМЫ =====
    const observer = new MutationObserver(function() {
      window.updateThemeColor();
    });
    observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    window.updateThemeColor();

    // ===== ОБНОВЛЕНИЕ СТАТИСТИКИ =====
    function updateStats() {
      if (typeof ProgressEngine === 'undefined') {
        document.getElementById('statCommitments').textContent = '-';
        document.getElementById('statPlanning').textContent = '-';
        document.getElementById('statProgress').textContent = '-';
        return;
      }

      const commitAnswers = ProgressEngine.getAnswers('responsibility', 'commitments');
      const overload = commitAnswers.overload ? commitAnswers.overload.answer : null;
      const overloadLabels = {
        'few': '✅ До 5',
        'many': '🟡 6–10',
        'too_many': '🔴 > 10'
      };
      document.getElementById('statCommitments').textContent = overload ? (overloadLabels[overload] || '❓') : '-';

      const planAnswers = ProgressEngine.getAnswers('responsibility', 'planning');
      const planStyle = planAnswers.planning_style ? planAnswers.planning_style.answer : null;
      const planLabels = {
        'list': '📝 Списки',
        'calendar': '📅 Календарь',
        'memory': '🧠 В голове',
        'chaos': '🌪️ Хаос'
      };
      document.getElementById('statPlanning').textContent = planStyle ? (planLabels[planStyle] || '❓') : '-';

      const totalAnswers = Object.keys(commitAnswers).length + Object.keys(planAnswers).length;
      const maxQuestions = 12;
      const pct = Math.min(Math.round((totalAnswers / maxQuestions) * 100), 100);
      document.getElementById('statProgress').textContent = pct > 0 ? pct + '%' : '-';
    }

    // ===== ИНИЦИАЛИЗАЦИЯ МОДУЛЯ =====
    (function initModule() {
      const moduleName = document.body.dataset.module;
      const lang = localStorage.getItem('compass_lang') || 'ru';
      window.currentLang = lang;
      document.documentElement.lang = lang;

      const titleEl = document.getElementById('quiz-title');
      if (titleEl && typeof t === 'function') {
        titleEl.textContent = t('cat_' + moduleName) || moduleName;
      }

      const greetingContainer = document.getElementById('greetingContainer');
      if (greetingContainer && typeof renderPersonalGreeting === 'function') {
        greetingContainer.innerHTML = renderPersonalGreeting();
      }

      renderModuleProgress(moduleName);
      updateStats();

      if (typeof InsightTimeline !== 'undefined') {
        InsightTimeline.render('timelineContainer');
      }

      if (typeof ProgressChart !== 'undefined') {
        const data = ProgressChart.getWeeklyData();
        const hasData = data && data.some(d => d.value > 0);
        const container = document.getElementById('chartContainer');
        if (hasData) {
          ProgressChart.renderMini('chartContainer', data);
        } else if (container) {
          container.innerHTML = '<p style="color:var(--text3);font-size:13px;text-align:center;padding:12px 0;">📊 Выполняй задания — и здесь появится график</p>';
        }
      }

      if (typeof FollowUpEngine !== 'undefined') {
        setTimeout(() => FollowUpEngine.checkAndShow(), 1500);
      }
    })();
  </script>
</body>
</html>
