<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#8b5cf6" id="themeColorMeta">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>🔄 КОМПАС — Привычки</title>
  <meta name="apple-mobile-web-app-title" content="Компас">
  <link rel="manifest" href="../../manifest.json">
  <link rel="apple-touch-icon" href="../../assets/icons/icon-192.png">
  <link rel="stylesheet" href="../../css/styles.css">
  <link rel="stylesheet" href="../../css/module.css">
  <link rel="stylesheet" href="../../css/modules/habits.css">
  
  <style>
    /* ===== ДОПОЛНИТЕЛЬНЫЕ СТИЛИ ДЛЯ МОДУЛЯ ===== */
    .module-header {
      text-align: center;
      padding: 20px 16px 8px;
    }
    
    .module-header .module-icon {
      font-size: 48px;
    }
    
    .module-header h1 {
      font-size: 28px;
      margin: 4px 0;
      font-weight: 800;
      color: var(--text);
    }
    
    .module-header .module-subtitle {
      font-size: 15px;
      color: var(--text2);
      margin: 0;
    }
    
    .lang-switcher {
      display: flex;
      gap: 8px;
      justify-content: center;
      padding: 8px 16px;
      flex-wrap: wrap;
    }
    
    .lang-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text2);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .lang-btn:hover {
      border-color: var(--border-hover);
      color: var(--text);
    }
    
    .lang-btn.active {
      border-color: #8b5cf6;
      color: #8b5cf6;
      font-weight: 600;
    }
    
    .theme-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text2);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .theme-btn:hover {
      border-color: var(--border-hover);
      color: var(--text);
    }
    
    .cat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 0 16px 16px;
    }
    
    .cat-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 20px 12px;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 16px;
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      min-height: 100px;
      text-align: center;
    }
    
    .cat-btn:hover {
      transform: translateY(-3px);
      border-color: #8b5cf6;
      box-shadow: 0 4px 20px rgba(139, 92, 246, 0.15);
    }
    
    .cat-btn:active {
      transform: scale(0.97);
    }
    
    .cat-btn .cat-icon {
      font-size: 32px;
    }
    
    .cat-btn .cat-badge {
      font-size: 11px;
      background: #22c55e;
      color: #fff;
      padding: 2px 10px;
      border-radius: 12px;
      font-weight: 700;
    }
    
    /* ===== КВИЗ ===== */
    .quiz-back {
      padding: 16px;
      text-align: center;
    }
    
    .quiz-back .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text2);
      padding: 10px 24px;
      border-radius: 12px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .quiz-back .btn-secondary:hover {
      border-color: var(--border-hover);
      color: var(--text);
    }
    
    /* ===== ТРЕКЕР ПРИВЫЧЕК ===== */
    .habit-tracker-section {
      margin: 0 16px 16px;
      padding: 16px;
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--border);
    }
    
    .habit-tracker-section h3 {
      font-size: 14px;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 0 0 12px;
    }
    
    /* ===== TIMELINE ===== */
    .timeline-section {
      margin: 16px;
      padding: 16px;
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--border);
    }
    
    .timeline-section h3 {
      font-size: 14px;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 0 0 12px;
    }
    
    /* ===== CHART ===== */
    .chart-section {
      margin: 16px;
      padding: 16px;
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--border);
    }
    
    .chart-section h3 {
      font-size: 14px;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 0 0 12px;
    }
    
    /* ===== ПРОГРЕСС ===== */
    .progress-bar {
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 6px;
    }
    
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #8b5cf6, #a78bfa);
      border-radius: 3px;
      transition: width 0.6s ease;
    }
    
    .progress-text {
      font-size: 12px;
      color: var(--text3);
      text-align: center;
    }
    
    /* ===== АДАПТИВ ===== */
    @media (max-width: 480px) {
      .cat-grid {
        gap: 8px;
      }
      .cat-btn {
        padding: 16px 8px;
        min-height: 80px;
        font-size: 13px;
      }
      .cat-btn .cat-icon {
        font-size: 28px;
      }
      .module-header h1 {
        font-size: 24px;
      }
    }
    
    @media (max-width: 360px) {
      .cat-grid {
        gap: 6px;
      }
      .cat-btn {
        padding: 12px 6px;
        min-height: 70px;
        font-size: 12px;
      }
      .cat-btn .cat-icon {
        font-size: 22px;
      }
      .module-header h1 {
        font-size: 20px;
      }
    }
  </style>
</head>
<body data-module="habits">
  <div class="app">
    <!-- ===== ЭКРАН ГЛАВНОЙ ===== -->
    <div class="screen active" id="screen-home">
      <div class="module-header">
        <div class="module-icon">🔄</div>
        <h1 data-i18n="habits_title">Привычки</h1>
        <p class="module-subtitle" data-i18n="habits_subtitle">Выберите направление</p>
      </div>

      <div class="lang-switcher">
        <button class="lang-btn active" data-lang="ru" onclick="setLang('ru')">🇷🇺 RU</button>
        <button class="lang-btn" data-lang="en" onclick="setLang('en')">🇬🇧 EN</button>
        <button class="theme-btn" onclick="window.toggleTheme && window.toggleTheme()">🌙</button>
      </div>

      <!-- ===== ПРИВЕТСТВИЕ ===== -->
      <div id="greetingContainer"></div>

      <!-- ===== ПРОГРЕСС МОДУЛЯ ===== -->
      <div id="moduleProgress"></div>

      <!-- ===== 4 КНОПКИ (2 РАБОЧИЕ + 2 ЗАГЛУШКИ) ===== -->
      <div class="cat-grid">
        <!-- Идентичность (рабочий) -->
        <button class="cat-btn" onclick="startFlow('identity')">
          <span class="cat-icon">🪞</span>
          <span data-i18n="cat_identity">Идентичность</span>
        </button>

        <!-- Среда (рабочий) -->
        <button class="cat-btn" onclick="startFlow('environment')">
          <span class="cat-icon">🌍</span>
          <span data-i18n="cat_environment">Среда</span>
        </button>

        <!-- Трекер (заглушка) -->
        <button class="cat-btn" onclick="showToast('🔄 В разработке')" style="opacity:0.6">
          <span class="cat-icon">📊</span>
          <span data-i18n="cat_tracker">Трекер</span>
        </button>

        <!-- Система (заглушка) -->
        <button class="cat-btn" onclick="showToast('🔄 В разработке')" style="opacity:0.6">
          <span class="cat-icon">⚙️</span>
          <span data-i18n="cat_system">Система</span>
        </button>
      </div>

      <!-- ===== ТРЕКЕР ПРИВЫЧЕК (виджет) ===== -->
      <div class="habit-tracker-section" id="habitTrackerWidget">
        <h3 data-i18n="habit_tracker_title">📊 Ваши привычки</h3>
        <div id="habitTrackerContainer">
          <p style="color:var(--text3);font-size:14px;text-align:center;padding:12px 0" data-i18n="habit_tracker_empty">
            Пока нет привычек. Начни с квиза «Идентичность»!
          </p>
        </div>
      </div>

      <!-- ===== TIMELINE ===== -->
      <div class="timeline-section">
        <h3 id="timelineTitle">📖 История инсайтов</h3>
        <div id="timelineContainer"></div>
      </div>

      <!-- ===== ГРАФИК ===== -->
      <div class="chart-section">
        <h3 id="chartTitle">📊 Прогресс за неделю</h3>
        <div id="chartContainer"></div>
      </div>

      <div style="text-align:center;padding:16px 0 24px">
        <a href="../../index.html" style="color:var(--text2);text-decoration:none;font-size:14px;transition:color 0.2s" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--text2)'">
          ← <span data-i18n="back_home">На главную</span>
        </a>
      </div>
    </div>

    <!-- ===== ЭКРАН КВИЗА ===== -->
    <div class="screen" id="screen-quiz">
      <div class="module-header">
        <div class="module-icon">🔄</div>
        <h1 id="quiz-title" data-i18n="habits_title">Привычки</h1>
        <p class="module-subtitle" id="quiz-subtitle" data-i18n="quiz_in_progress">Прохождение квиза</p>
      </div>

      <div id="quiz-container" style="padding:0 16px"></div>

      <div class="quiz-back">
        <button class="btn-secondary" onclick="goHome()">← <span data-i18n="back">Назад</span></button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- ===== SCRIPTS ===== -->
  <script src="../../core/locales.js"></script>
  <script src="../../core/registry.js"></script>
  <script src="../../core/theme.js"></script>
  <script src="../../core/progressEngine.js"></script>

  <script>
    // ===== УСТАНОВКА ЯЗЫКА =====
    function setLang(l) {
      localStorage.setItem('compass_lang', l);
      window.currentLang = l;
      location.reload();
    }
    
    window.currentLang = localStorage.getItem('compass_lang') || 'ru';
    
    document.addEventListener('DOMContentLoaded', function() {
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === window.currentLang);
      });
    });
  </script>

  <!-- ===== ДАННЫЕ КВИЗОВ ===== -->
  <script src="data/identity.js"></script>
  <script src="data/environment.js"></script>
  <script src="data/en/identity-en.js"></script>
  <script src="data/en/environment-en.js"></script>

  <!-- ===== ЯДРО ===== -->
  <script src="../../core/engine.js"></script>
  <script src="../../core/tracker.js"></script>
  <script src="../../core/app.js"></script>

  <script>
    // ===== SERVICE WORKER =====
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../../sw.js')
        .then(r => console.log('✅ SW ok', r.scope))
        .catch(e => console.error('❌ SW err', e));
    }

    // ===== ОБНОВЛЕНИЕ МЕТА-ТЕГА ТЕМЫ =====
    function updateThemeColor() {
      const meta = document.getElementById('themeColorMeta');
      if (!meta) return;
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      meta.content = isDark ? '#0c1220' : '#f1f5f9';
    }
    
    const observer = new MutationObserver(function() {
      updateThemeColor();
    });
    observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    updateThemeColor();

    // ===== ОБНОВЛЕНИЕ ПЕРЕВОДОВ =====
    function updateTranslations() {
      const lang = window.currentLang || 'ru';
      const texts = typeof LOCALES !== 'undefined' ? (LOCALES[lang] || LOCALES.ru) : {};
      
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        if (texts[key]) {
          el.textContent = texts[key];
        }
      });
    }

    // ===== РЕНДЕР ТРЕКЕРА ПРИВЫЧЕК =====
    function renderHabitTracker() {
      const container = document.getElementById('habitTrackerContainer');
      if (!container) return;
      
      if (typeof HabitTracker === 'undefined') {
        container.innerHTML = `<p style="color:var(--text3);font-size:14px;text-align:center;padding:12px 0">Трекер загружается...</p>`;
        return;
      }
      
      const habits = HabitTracker.getActive();
      if (habits.length === 0) {
        container.innerHTML = `<p style="color:var(--text3);font-size:14px;text-align:center;padding:12px 0" data-i18n="habit_tracker_empty">Пока нет привычек. Начни с квиза «Идентичность»!</p>`;
        return;
      }
      
      const today = new Date().toDateString();
      let html = '<div style="display:flex;flex-direction:column;gap:8px">';
      
      for (const h of habits.slice(0, 3)) {
        const isDone = h.history.includes(today);
        html += `<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--bg);border-radius:10px;border:1px solid var(--border)">
          <span style="font-weight:600;font-size:14px">${h.name}</span>
          <span style="font-size:13px;color:var(--text2)">🔥 ${h.streak || 0}</span>
          <span style="font-size:16px">${isDone ? '✅' : '⬜'}</span>
        </div>`;
      }
      
      if (habits.length > 3) {
        html += `<div style="text-align:center;padding:4px 0;font-size:13px;color:var(--text3)">+ ещё ${habits.length - 3} привычек</div>`;
      }
      
      html += '</div>';
      container.innerHTML = html;
    }

    // ===== ИНИЦИАЛИЗАЦИЯ МОДУЛЯ =====
    (function initModule() {
      const moduleName = document.body.dataset.module;
      const lang = localStorage.getItem('compass_lang') || 'ru';
      window.currentLang = lang;
      document.documentElement.lang = lang;

      const titleEl = document.getElementById('quiz-title');
      if (titleEl && typeof t === 'function') {
        titleEl.textContent = t('cat_' + moduleName) || moduleName;
      }

      // Приветствие
      const greetingContainer = document.getElementById('greetingContainer');
      if (greetingContainer && typeof renderPersonalGreeting === 'function') {
        greetingContainer.innerHTML = renderPersonalGreeting();
      }

      // Прогресс модуля
      renderModuleProgress(moduleName);

      // Трекер привычек
      renderHabitTracker();

      // Timeline
      if (typeof InsightTimeline !== 'undefined') {
        InsightTimeline.render('timelineContainer');
      }

      // График
      if (typeof ProgressChart !== 'undefined') {
        const data = ProgressChart.getWeeklyData();
        const hasData = data && data.some(d => d.value > 0);
        const container = document.getElementById('chartContainer');
        if (hasData) {
          ProgressChart.renderMini('chartContainer', data);
        } else if (container) {
          container.innerHTML = '<p style="color:var(--text3);font-size:13px;text-align:center;padding:12px 0;">📊 Выполняй задания — и здесь появится график</p>';
        }
      }

      // Follow-up
      if (typeof FollowUpEngine !== 'undefined') {
        setTimeout(() => FollowUpEngine.checkAndShow(), 1500);
      }
    })();

    function renderModuleProgress(moduleName) {
      const container = document.getElementById('moduleProgress');
      if (!container) return;

      const moduleCategories = {
        purpose: ['passion', 'skills'],
        happiness: ['blockers', 'energy_audit'],
        habits: ['identity', 'environment'],
        money: ['os', 'audit'],
        responsibility: ['commitments', 'planning'],
        health: ['sleep', 'nutrition'],
        learning: ['reading', 'techniques'],
        creativity: ['channel', 'fear'],
        relationships: ['family', 'conflicts']
      };

      const cats = moduleCategories[moduleName] || [];
      const done = cats.filter(c => localStorage.getItem('compass_' + moduleName + '_' + c + '_completed') === 'true').length;
      const pct = cats.length ? Math.round((done / cats.length) * 100) : 0;
      
      container.innerHTML = `
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="progress-text">${typeof t === 'function' ? t('progress_modules') : '📊 Прогресс'}: ${done}/${cats.length}</div>
      `;
    }
  </script>
</body>
</html>
